[package]
name = "nyanpasu-service"
version = "2.0.2"
edition = "2024"
repository = { workspace = true }
license = { workspace = true }
default-run = "nyanpasu-service"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nyanpasu-service-runtime = { path = "../crates/nyanpasu-service-runtime" }
nyanpasu-utils = { path = "../crates/nyanpasu-utils", default-features = false, features = ["process"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing.workspace = true

[target."cfg(windows)".dependencies]
windows-service = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
deadlock_detection = ["nyanpasu-service-runtime/deadlock_detection"]
debug = ["nyanpasu-service-runtime/debug"]
hardware-lock-elision = ["nyanpasu-service-runtime/hardware-lock-elision"]
tracing = ["nyanpasu-service-runtime/tracing"]
